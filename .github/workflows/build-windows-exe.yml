name: Build Windows exe

# Builds the .exe on a GitHub Windows machine, so you can download it without
# installing a JDK yourself. Run it from the Actions tab ("Run workflow"), then
# download the artifact at the bottom of the run page.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build portable .exe
        run: .\build.bat

      - name: Zip portable app
        run: Compress-Archive -Path dist\GifSlideShowApp\* -DestinationPath GifSlideShowApp-windows-portable.zip
        shell: pwsh

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: GifSlideShowApp-windows-portable
          path: GifSlideShowApp-windows-portable.zip

      # The installer needs WiX. If it is unavailable the portable build above
      # is still published, so this step is allowed to fail.
      - name: Install WiX 3.14
        continue-on-error: true
        run: dotnet tool install --global wix --version 3.14.1 || choco install wixtoolset --no-progress -y
        shell: pwsh

      - name: Build installer
        continue-on-error: true
        run: .\build.bat installer

      - name: Upload installer
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: GifSlideShowApp-windows-installer
          path: dist\*.exe
          if-no-files-found: warn
